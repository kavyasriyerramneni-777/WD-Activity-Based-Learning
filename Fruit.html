                        <h2>INGREDIANTS:</h2>
                        <ul>
                            <li>1/2 cup rolled oats</li>
                            <li>1 cup milk or fortified alternative</li>
                            <li>1 small banana</li>
                            <li>A few nuts</li>
                        </ul>
                        <h2>PREPARATION METHOD:</h2>
                        <p>Cook the oats in milk until soft.
                        Add sliced banana and nuts.</p>
